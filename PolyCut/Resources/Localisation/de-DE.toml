"This value is affected by your printer's Z-Offset." = "Dieser Wert wird vom Z-Versatz Ihres Druckers beeinflusst."

[context."Z Offset Per Pass Tooltip"]
"For cutting or engraving thicker materials, a slightly negative value can be used to gradually cut deeper with each pass, which can improve quality and reduce the chance of blade breakage." = "Beim Schneiden oder Gravieren dickerer Materialien kann ein leicht negativer Wert verwendet werden, um mit jedem Durchgang schrittweise tiefer zu schneiden. Dies kann die Qualität verbessern und das Risiko eines Klingenbruchs verringern."
"Positive values move the tool up after each pass, while negative values move the tool down after each pass." = "Positive Werte bewegen das Werkzeug nach jedem Durchgang nach oben, negative Werte nach unten."
"The distance in Z that the tool should move after each pass when multiple passes are enabled." = "Die Strecke in Z-Richtung, die das Werkzeug nach jedem Durchgang zurücklegen soll, wenn mehrere Durchgänge aktiviert sind."
