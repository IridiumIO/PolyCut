[context."Z Offset Per Pass Tooltip"]
"For cutting or engraving thicker materials, a slightly negative value can be used to gradually cut deeper with each pass, which can improve quality and reduce the chance of blade breakage." = "Pour couper ou graver des matériaux plus épais, une valeur légèrement négative peut être utilisée afin de couper progressivement plus profondément à chaque passe, ce qui peut améliorer la qualité et réduire le risque de casse de la lame."
"Positive values move the tool up after each pass, while negative values move the tool down after each pass." = "Les valeurs positives déplacent l’outil vers le haut après chaque passe, tandis que les valeurs négatives le déplacent vers le bas."
"The distance in Z that the tool should move after each pass when multiple passes are enabled." = "Distance en Z que l’outil doit parcourir après chaque passe lorsque plusieurs passes sont activées."
