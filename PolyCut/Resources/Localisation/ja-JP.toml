[context."Tool Diameter Tooltip"]
"Most blades are ~1mm in diameter, however the point of the blade may not be at the very edge." = "ほとんどのブレードは直径約 1 mm ですが、刃先が外周の端に位置しているとは限りません。"
"Setting the tool diameter correctly adds a compensatory swivel for blade rotation to align with the next move. This is most noticeable on tiny features." = "ツール直径を正しく設定すると、ブレードの回転を補正する旋回動作が追加され、次の移動方向に刃先が揃います。特に非常に小さな形状で効果が目立ちます。"
"of the swivelling part of the cutting blade." = "切断ブレードの旋回部分の。"

[context."Tool Mode"]
"Cut" = "切断"
"Draw" = "描画"

[context."Tool Mode Tooltip"]
"Settings designed for cutting objects out using a drag-knife." = "ドラッグナイフを使用してオブジェクトを切り抜くための設定です。"
"Settings designed for drawing using a pen, marker, or even a foil stamping pen." = "ペン、マーカー、または箔押しペンなどで描画するための設定です。"

[context."Tool Speed Tooltip"]
"Slower is usually better" = "通常は遅い方が良好です"
"Speed of the toolhead when the tool is down and cutting/drawing." = "ツールが下がって切断/描画しているときのツールヘッド速度。"

[context."TracingMode Tooltip"]
"Fits edges using smooth curves for organic outlines." = "滑らかな曲線でエッジをフィッティングし、有機的な輪郭を作ります。"
"Keeps hard, blocky pixel-edge outlines with no curve fitting. Great for pixel art" = "曲線フィッティングを行わず、硬く角ばったピクセルエッジの輪郭を保持します。ピクセルアートに最適です"
"Pixel - " = "ピクセル - "
"Polygon - " = "ポリゴン - "
"Sets the curve-fitting style used to outline each region." = "各領域の輪郭に使用する曲線フィッティング方式を設定します。"
"Spline - " = "スプライン - "
"Tracing Mode (Default = Spline)" = "トレースモード（既定 = スプライン）"
"Uses straight line segments" = "直線セグメントを使用します"

[context."Travel Speed ToolTip"]
"Speed of the toolhead when the tool is raised and not actively cutting/drawing." = "ツールが上がっていて切断/描画を行っていないときのツールヘッド速度。"

[context."Z Height Tooltip"]
"How high above the workpiece the toolhead should be positioned when travelling or drawing." = "移動または描画するときに、ワーク表面からどの高さにツールヘッドを配置するかを指定します。"
"Positive values are offset above the bed surface." = "正の値はベッド表面より上方向のオフセットになります。"
"This value is affected by your printer's Z-Offset." = "この値はプリンターの Z オフセットの影響を受けます。"

[context."Z Offset Per Pass Tooltip"]
"For cutting or engraving thicker materials, a slightly negative value can be used to gradually cut deeper with each pass, which can improve quality and reduce the chance of blade breakage." = "厚い材料を切断または彫刻する場合、わずかに負の値を設定すると各パスで徐々に深く加工できます。これにより品質が向上し、ブレード破損の可能性を低減できる場合があります。"
"Positive values move the tool up after each pass, while negative values move the tool down after each pass." = "正の値では各パス後にツールが上がり、負の値では下がります。"
"The distance in Z that the tool should move after each pass when multiple passes are enabled." = "複数パスが有効な場合に、各パスの後でツールを Z 方向に移動する距離。"
